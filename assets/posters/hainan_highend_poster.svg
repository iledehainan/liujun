<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#09243b"/>
      <stop offset="50%" stop-color="#0A2342"/>
      <stop offset="100%" stop-color="#00A2D3"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feBlend in="SourceGraphic" in2="b" mode="normal"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="url(#bg)"/>

  <!-- Decorative sun glow -->
  <circle cx="860" cy="380" r="280" fill="#FFD58A" opacity="0.08" filter="url(#soft)" />

  <!-- Faint wave shapes -->
  <path d="M0,1200 C180,1120 360,1160 540,1100 C720,1040 900,1080 1080,1000 L1080,1920 L0,1920 Z" fill="#FFFFFF" opacity="0.04"/>
  <path d="M0,1320 C240,1240 420,1280 660,1220 C840,1180 960,1220 1080,1160 L1080,1920 L0,1920 Z" fill="#FFFFFF" opacity="0.03"/>

  <!-- Title -->
  <text x="80" y="220" font-family="Sans-serif" font-weight="700" font-size="64" fill="#F4E7C7" letter-spacing="2">海南 · 奢享热带时光</text>

  <!-- Subtitle -->
  <text x="80" y="320" font-family="Sans-serif" font-size="28" fill="#FFFFFF" opacity="0.95">白沙、海风与日落，给生活一场慢慢的浪漫</text>

  <!-- Main image placeholder (useful for designers to replace) -->
  <rect x="60" y="380" width="960" height="760" rx="14" ry="14" fill="#FFFFFF" opacity="0.06" />
  <text x="120" y="760" font-family="Sans-serif" font-size="28" fill="#FFFFFF" opacity="0.20">（主视觉：日落海岸 / 海景别墅 图片，建议替换为高清照片）</text>

  <!-- Body text box -->
  <rect x="60" y="1160" width="960" height="420" rx="12" ry="12" fill="#FFFFFF" opacity="0.08" />
  <g fill="#FFFFFF" opacity="0.98" font-family="Sans-serif">
    <text x="110" y="1220" font-size="34" font-weight="600">在海南，日光比海水更温柔，</text>
    <text x="110" y="1276" font-size="34" font-weight="600">海风比城市更清醒，</text>
    <text x="110" y="1332" font-size="34" font-weight="600">每一处海景都像一场私藏的诗篇。</text>

    <text x="110" y="1410" font-size="28">从海边度假到热带雨林探秘，</text>
    <text x="110" y="1446" font-size="28">从精品酒店到海鲜美食与夜晚海风，</text>
    <text x="110" y="1482" font-size="28">这里的一切，都是为慢慢享受而准备。</text>

    <text x="110" y="1548" font-size="26" fill="#F4E7C7">预约专属度假套餐 · 让每一个瞬间，都值得被珍藏</text>
  </g>

  <!-- CTA button -->
  <g>
    <rect x="720" y="1630" width="300" height="90" rx="12" ry="12" fill="#D7B56D" />
    <text x="870" y="1695" font-family="Sans-serif" font-size="28" fill="#082033" font-weight="700" text-anchor="middle">立即预订 · 尊享海岛礼遇</text>
  </g>

  <!-- QR code placeholder and contact -->
  <rect x="80" y="1630" width="160" height="160" rx="10" ry="10" fill="#FFFFFF" opacity="0.12" />
  <text x="160" y="1720" font-family="Sans-serif" font-size="20" fill="#FFFFFF" opacity="0.9" text-anchor="middle">扫码预订</text>
  <text x="260" y="1790" font-family="Sans-serif" font-size="18" fill="#FFFFFF" opacity="0.75">400-XXX-XXXX · www.example-travel.com</text>

  <!-- Footer small tagline -->
  <text x="80" y="1870" font-family="Sans-serif" font-size="18" fill="#FFFFFF" opacity="0.6">热带时光，属于慢慢享受的人</text>

  <!-- Designer note (hidden for print if desired) -->
  <text x="60" y="1908" font-family="Sans-serif" font-size="12" fill="#FFFFFF" opacity="0.05">Generated by assistant — replace main image with a high-resolution photo before printing. Colors: 深海蓝 #0A2342 | 海蓝 #00A2D3 | 沙金 #D7B56D</text>
</svg>
